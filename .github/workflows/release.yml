name: Release Mod

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Remove maintainer local Java path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # UBM depends on de.julianweinelt.pathfinder:PathFinderAPI:1.1.2, which
      # is not available on any public Maven repository, so build it from
      # source and install it into the local Maven repository.
      - name: Checkout PathFinder API
        uses: actions/checkout@v6
        with:
          repository: JWeinelt/PathFinder-API
          path: pathfinder-api
          fetch-depth: 1

      - name: Build PathFinder API
        working-directory: pathfinder-api
        run: |
          sed -i -E \
            "s/version = '[^']+'/version = '1.1.2'/g" \
            build.gradle

          ./gradlew clean build publishToMavenLocal --no-daemon

      - name: Add Maven Local to UBM
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          text = path.read_text()

          if "mavenLocal()" in text:
              print("mavenLocal() already present.")
              raise SystemExit(0)

          marker = '''repositories {
              maven {
                  name = "maven-releases"
          '''

          replacement = '''repositories {
              mavenLocal()

              maven {
                  name = "maven-releases"
          '''

          if marker not in text:
              raise SystemExit(
                  "Could not find the UBM project repositories block."
              )

          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          print("mavenLocal() added to project repositories.")
          PY

      - name: Build UBM
        run: ./gradlew clean build --no-daemon
        
      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: R8jBhfbN
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}
  
          curseforge-id: 494079
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
  
          loaders: |
            forge
          game-versions: |
            1.12.2
            
          dependencies: |
            pathfinder-api
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
