name: UBM AutoBuild

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

  pull_request:
    branches:
      - "1.12.2"

concurrency:
  group: ubm-autobuild
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autobuild:
    name: Sync, build and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check upstream
        id: upstream
        env:
          UPSTREAM_REPO: JWeinelt/UltimateBackportMod
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream 1.12.2 --depth=1

          UPSTREAM_SHA="$(git rev-parse upstream/1.12.2)"
          CURRENT_UPSTREAM_SHA=""

          if [ -f .upstream-sha ]; then
            CURRENT_UPSTREAM_SHA="$(cat .upstream-sha)"
          fi

          echo "Current upstream SHA: ${CURRENT_UPSTREAM_SHA:-<none>}"
          echo "Latest upstream SHA:  $UPSTREAM_SHA"

          if [ "$CURRENT_UPSTREAM_SHA" = "$UPSTREAM_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
            echo "Upstream changed."
          fi

      - name: Stop if upstream did not change
        if: steps.upstream.outputs.changed != 'true'
        run: |
          echo "Nothing to build."
          exit 0

      - name: Save workflow files
        if: steps.upstream.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/ubm-autobuild"
          cp -r .github/workflows \
            "$RUNNER_TEMP/ubm-autobuild/workflows"

      - name: Sync fork with upstream
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
          SYNC_TOKEN: ${{ secrets.UBM_SYNC_TOKEN }}
        run: |
          # GITHUB_TOKEN cannot push commits that touch .github/workflows;
          # the PAT in UBM_SYNC_TOKEN (with the `workflow` scope) is used when
          # it exists, otherwise the default token is used and the push fails
          # if the sync commit modifies any workflow file.
          if [ -n "$SYNC_TOKEN" ]; then
            git remote set-url origin \
              "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          git reset --hard "$UPSTREAM_SHA"

          mkdir -p .github/workflows
          cp -r "$RUNNER_TEMP/ubm-autobuild/workflows/." \
            .github/workflows/

          echo "$UPSTREAM_SHA" > .upstream-sha

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/ .upstream-sha

          git commit \
            -m "chore: sync upstream ${UPSTREAM_SHA}" \
            || true

          if ! git push origin HEAD:1.12.2 --force-with-lease; then
            MSG="The sync commit contains workflow files, which GITHUB_TOKEN may not push. Create a PAT with the 'workflow' scope and store it as a repository secret named UBM_SYNC_TOKEN."
            echo "::error title=Sync push failed::$MSG"
            exit 1
          fi

      - name: Set up JDK 8
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: "temurin"

      - name: Remove maintainer local Java path
        if: steps.upstream.outputs.changed == 'true'
        run: |
          sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Setup Gradle
        if: steps.upstream.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Checkout PathFinder API
        if: steps.upstream.outputs.changed == 'true'
        uses: actions/checkout@v6
        with:
          repository: JWeinelt/PathFinder-API
          path: pathfinder-api
          fetch-depth: 1

      - name: Build PathFinder API
        if: steps.upstream.outputs.changed == 'true'
        working-directory: pathfinder-api
        run: |
          sed -i -E \
            "s/version = '[^']+'/version = '1.1.2'/g" \
            build.gradle

          ./gradlew clean build publishToMavenLocal --no-daemon

      - name: Verify PathFinder API
        if: steps.upstream.outputs.changed == 'true'
        run: |
          echo "Published PathFinder API:"
          find \
            "$HOME/.m2/repository/de/julianweinelt/pathfinder/PathFinderAPI/1.1.2" \
            -maxdepth 1 \
            -type f \
            -print

      - name: Add Maven Local to UBM
        if: steps.upstream.outputs.changed == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          text = path.read_text()

          if "mavenLocal()" in text:
              print("mavenLocal() already present.")
              raise SystemExit(0)

          marker = '''repositories {
              maven {
                  name = "maven-releases"
          '''

          replacement = '''repositories {
              mavenLocal()

              maven {
                  name = "maven-releases"
          '''

          if marker not in text:
              raise SystemExit(
                  "Could not find the UBM project repositories block."
              )

          text = text.replace(marker, replacement, 1)
          path.write_text(text)

          print("mavenLocal() added to project repositories.")
          PY

      - name: Build UBM
        if: steps.upstream.outputs.changed == 'true'
        run: |
          ./gradlew clean build --no-daemon

      - name: Prepare release
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          mkdir -p release

          JAR="$(find build/libs \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*-sources.jar' \
            | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "No UBM JAR found in build/libs."
            exit 1
          fi

          cp "$JAR" "release/UBM-${UPSTREAM_SHA}.jar"

          PATHFINDER_SHA="$(
            git -C pathfinder-api rev-parse HEAD \
            2>/dev/null || echo "unknown"
          )"

          cat > release/notes.md <<EOF
          # UBM AutoBuild

          Automated build of UltimateBackportMod 1.12.2.

          **Upstream UBM commit:** \`${UPSTREAM_SHA}\`

          **PathFinder-API commit:** \`${PATHFINDER_SHA}\`

          PathFinder-API was built from source and installed locally as:

          \`de.julianweinelt.pathfinder:PathFinderAPI:1.1.2\`

          This is an unofficial automated build.
          EOF

          echo "Prepared release files:"
          ls -lh release/

      - name: Create or update rolling release
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.upstream_sha }}
        run: |
          echo "Target repository: $REPO"

          if gh release view autobuild --repo "$REPO" >/dev/null 2>&1; then
            echo "Updating existing AutoBuild release."

            gh release view autobuild \
              --repo "$REPO" \
              --json assets \
              --jq '.assets[].name' \
            | while read -r ASSET; do
                gh release delete-asset \
                  autobuild \
                  "$ASSET" \
                  --repo "$REPO" \
                  --yes
              done

            gh release upload \
              autobuild \
              "release/UBM-${UPSTREAM_SHA}.jar" \
              --repo "$REPO" \
              --clobber

            gh release edit \
              autobuild \
              --repo "$REPO" \
              --title "UBM AutoBuild" \
              --notes-file release/notes.md \
              --prerelease \
              --latest=false

          else
            echo "Creating AutoBuild release."

            gh release create \
              autobuild \
              "release/UBM-${UPSTREAM_SHA}.jar" \
              --repo "$REPO" \
              --title "UBM AutoBuild" \
              --notes-file release/notes.md \
              --prerelease \
              --latest=false
          fi

      # The GitHub release above is created with the GITHUB_TOKEN, which does
      # not trigger `release: published` workflows. Publish to Modrinth and
      # CurseForge directly from this job instead of relying on the separate
      # "Release Mod" workflow firing.
      - name: Check publish tokens
        id: publish-check
        if: steps.upstream.outputs.changed == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          MISSING=""

          [ -z "$MODRINTH_TOKEN" ] && MISSING="$MISSING MODRINTH_API_TOKEN"
          [ -z "$CURSEFORGE_TOKEN" ] && MISSING="$MISSING CURSEFORGE_API_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "::warning title=Mod publish skipped::Missing secrets:$MISSING"
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Modrinth and CurseForge
        id: modpublish
        if: steps.upstream.outputs.changed == 'true' && steps.publish-check.outputs.published == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: R8jBhfbN
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}

          curseforge-id: 494079
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}

          loaders: |
            forge
          game-versions: |
            1.12.2

          dependencies: |
            pathfinder-api
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
